

# MapOSCAL Configuration File
# This file configures the analysis and generation of OSCAL components

# Repository and output settings
repo_path: "/path/to/your/repository"
output_dir: ".oscalgen"

# Catalog and profile paths for OSCAL generation
catalog_path: "examples/NIST_SP-800-53_rev5_catalog.json"
profile_path: "examples/FedRAMP_rev5_HIGH-baseline_profile.json"

# Analysis settings
top_k: 5
max_critique_retries: 3

# Configuration file discovery settings
config_extensions: [".yaml", ".yml", ".json", ".toml", ".ini", ".conf", ".properties"]
auto_discover_config: true
config_files: []  # Used when auto_discover_config is false

# Dockerfile analysis settings
dockerfile:
  path: "Dockerfile"  # Path to Dockerfile relative to repo root
  transport_security: true  # Whether Dockerfile handles TLS/transport security
  exclude_from_analysis: true  # Exclude from regular repository analysis
  entrypoint_analysis: true  # Analyze ENTRYPOINT scripts separately

# Kubernetes resource analysis settings
# Configure Kubernetes manifest analysis for OSCAL component generation
k8s:
  k8s_paths:  # List of directories containing K8s resource YAML files
    - "examples/k8s-sample"  # Sample K8s resources for testing
    - "/path/to/your/k8s/manifests"
    - "/path/to/your/helm/charts"
    - "/path/to/your/operators"
  # Additional K8s-specific settings can be added here as needed

# LLM Configuration
# You can specify different LLM providers and models for each command
llm:
  # Global LLM settings (used as defaults)
  provider: "openai"
  model: "gpt-4"
  temperature: 0.4  # Global default temperature
  
  # Command-specific LLM settings (override global settings)
  analyze:
    provider: "openai"
    model: "gpt-4o-mini"  # Fast, cost-effective for analysis
    temperature: 0.1  # Low temperature for consistent analysis
    
  summarize:
    provider: "openai"
    model: "gpt-4"  # High quality for summaries
    temperature: 0.2  # Low temperature for consistent summaries
    
  generate:
    provider: "openai"
    model: "gpt-4"  # High quality for OSCAL generation
    temperature: 0.4  # Moderate temperature for creative but structured generation
    
  evaluate:
    provider: "openai"
    model: "gpt-4"  # High quality for evaluation
    temperature: 0.0  # Very low temperature for deterministic evaluation
    
  k8s_process:
    provider: "openai"
    model: "gpt-4"  # High quality for Kubernetes resource analysis
    temperature: 0.3  # Moderate temperature for structured K8s analysis

# Example configurations for different providers:
# 
# OpenAI:
#   provider: "openai"
#   model: "gpt-4" | "gpt-4-turbo" | "gpt-3.5-turbo" | "gpt-4o" | "gpt-4o-mini"
#
# Gemini (via OpenAI-compatible API):
#   provider: "gemini"
#   model: "gemini-2.0-flash" | "gemini-2.5-flash" | "gemini-1.5-pro" | "gemini-1.5-flash"

# Environment Variables Required:
# For OpenAI: OPENAI_API_KEY
# For Gemini: GEMINI_API_KEY
#
# Optional base URL overrides:
# OPENAI_BASE_URL, GEMINI_BASE_URL 