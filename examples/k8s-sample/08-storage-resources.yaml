  name: shared-storage-pv
  labels:
    app: shared
    component: storage
    tier: shared
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: slow-hdd
  nfs:
    server: nfs.example.com
    path: /shared
