apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  namespace: maposcal-demo
  labels:
    app: database
    component: postgres
    tier: data
spec:
  serviceName: postgres-service
  replicas: 3
  selector:
    matchLabels:
      app: database
      component: postgres
      tier: data
  template:
    metadata:
      labels:
        app: database
        component: postgres
        tier: data
        version: v13.0
    spec:
      serviceAccountName: postgres-sa
      containers:
      - name: postgres
        image: postgres:13-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "webapp"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: password
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-config
        configMap:
          name: postgres-config
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: maposcal-demo
  labels:
    app: database
    component: postgres
    tier: data
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: database
    component: postgres
    tier: data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: maposcal-demo
  labels:
    app: database
    component: postgres
    tier: data
data:
  postgresql.conf: |
    # Database configuration
    max_connections = 100
    shared_buffers = 128MB
    effective_cache_size = 512MB
    maintenance_work_mem = 64MB
    checkpoint_completion_target = 0.9
    wal_buffers = 4MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 4MB
    min_wal_size = 1GB
    max_wal_size = 4GB
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: maposcal-demo
  labels:
    app: database
    component: postgres
    tier: data
type: Opaque
data:
  username: cG9zdGdyZXM=  # postgres
  password: cGFzc3dvcmQxMjM=  # password123
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: maposcal-demo
  labels:
    app: database
    component: postgres
    tier: data
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-role
  namespace: maposcal-demo
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-role-binding
  namespace: maposcal-demo
subjects:
- kind: ServiceAccount
  name: postgres-sa
  namespace: maposcal-demo
roleRef:
  kind: Role
  name: postgres-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: maposcal-demo
  labels:
    app: database
    component: postgres
    tier: data
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: database
      component: postgres
      tier: data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: maposcal-demo
  labels:
    app: database
    component: postgres
    tier: data
spec:
  podSelector:
    matchLabels:
      app: database
      component: postgres
      tier: data
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: maposcal-demo
    ports:
    - protocol: TCP
      port: 5432
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
